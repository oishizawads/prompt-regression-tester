<style>
  html,body,#root{height:100%;margin:0}

    display:flex;align-items:center;justify-content:center;height:100vh;

<body>
<div id="root"><div id="boot"><div class="k">Loading demo</div><div>Prompt Regression Tester を起動中… 初回はPython実行環境の読み込みに数十秒かかります。</div></div></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
mount({"requirements": ["pandas"], "entrypoint": "app/streamlit_app.py", "files": {"app/streamlit_app.py": "\"\"\"prompt-regression-tester の Streamlit エントリポイント。\n\n計算ロジックは src/ に委譲し、このファイルは表示のみを担う。\n実行: streamlit run app/streamlit_app.py （API キー不要）\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\n\n_REPO_ROOT = Path(__file__).resolve().parent.parent\nif str(_REPO_ROOT) not in sys.path:\n    sys.path.insert(0, str(_REPO_ROOT))\n\nfrom src import (  # noqa: E402\n    DEFAULT_SIMILARITY_THRESHOLD,\n    LoaderError,\n    TestCase,\n    changed_line_indices,\n    load_cases,\n    load_cases_from_records,\n    score_cases,\n    side_by_side,\n    unified_diff_lines,\n)\n\n_SAMPLE_CSV = _REPO_ROOT / \"sample_data\" / \"sample_cases.csv\"\n_SAMPLE_JSON = _REPO_ROOT / \"sample_data\" / \"sample_cases.json\"\n\n\ndef _cases_to_records(cases: list[TestCase]) -> list[dict]:\n    \"\"\"UI 表示用に TestCase リストを dict 行へ戻す。\"\"\"\n    return [\n        {\n            \"case_id\": c.case_id,\n            \"task\": c.task,\n            \"prompt_old\": c.prompt_old,\n            \"prompt_new\": c.prompt_new,\n            \"expected_output\": c.expected_output,\n            \"old_output\": c.old_output,\n            \"new_output\": c.new_output,\n            \"keywords\": \",\".join(c.keywords),\n            \"forbidden\": \",\".join(c.forbidden),\n        }\n        for c in cases\n    ]\n\n\ndef _render_diff(case: TestCase) -> None:\n    \"\"\"旧・新を並列表示し、変更行を強調する。\"\"\"\n    old_lines, new_lines = side_by_side(case)\n    changed = set(changed_line_indices(case))\n    if not old_lines and not new_lines:\n        st.caption(\"出力が空のため差分なし\")\n        return\n    cols = st.columns(2)\n    with cols[0]:\n        st.markdown(\"**旧出力 (old)**\")\n        for i, line in enumerate(old_lines):\n            style = \"background:#3a1f1f;\" if i in changed else \"\"\n            st.markdown(\n                f'<div style=\"{style}padding:2px 6px;border-radius:4px;'\n                f'white-space:pre-wrap;font-family:monospace;\">'\n                f'{line if line else \" \"}</div>',\n                unsafe_allow_html=True,\n            )\n    with cols[1]:\n        st.markdown(\"**新出力 (new)**\")\n        for i, line in enumerate(new_lines):\n            style = \"background:#1f3a1f;\" if i in changed else \"\"\n            st.markdown(\n                f'<div style=\"{style}padding:2px 6px;border-radius:4px;'\n                f'white-space:pre-wrap;font-family:monospace;\">'\n                f'{line if line else \" \"}</div>',\n                unsafe_allow_html=True,\n            )\n    with st.expander(\"unified diff\", expanded=False):\n        diff = unified_diff_lines(case)\n        st.code(\"\\n\".join(diff), language=\"diff\")\n\n\ndef _load_cases_from_input(uploaded, source: str) -> list[TestCase]:\n    \"\"\"入力ソース種別に応じて TestCase リストを組み立てる。エラーは表示して空リストへ。\"\"\"\n    if source == \"サンプル (CSV)\":\n        return load_cases(_SAMPLE_CSV)\n    if source == \"サンプル (JSON)\":\n        return load_cases(_SAMPLE_JSON)\n    if uploaded is None:\n        return []\n    suffix = Path(uploaded.name).suffix.lower()\n    if suffix not in {\".csv\", \".json\"}:\n        st.error(\"対応形式は .csv または .json です\")\n        return []\n    raw = uploaded.getvalue().decode(\"utf-8\")\n    if not raw.strip():\n        return []\n    tmp = _REPO_ROOT / \".tmp_upload\" / uploaded.name\n    tmp.parent.mkdir(parents=True, exist_ok=True)\n    tmp.write_text(raw, encoding=\"utf-8\")\n    try:\n        return load_cases(tmp)\n    except LoaderError as e:\n        st.error(f\"読み込みエラー: {e}\")\n        return []\n    finally:\n        if tmp.exists():\n            tmp.unlink()\n\n\ndef main() -> None:\n    \"\"\"アプリ本体。UI と状態管理のみ。\"\"\"\n    st.set_page_config(\n        page_title=\"Prompt Regression Tester\",\n        page_icon=\"🧪\",\n        layout=\"wide\",\n    )\n    from src.brand import (\n        apply_brand,\n        footer_backlink,\n        hero,\n        section,\n        sidebar_header,\n    show_table,\n)\n    apply_brand(st)\n    hero(\n        st,\n        \"LLM EVALUATION\",\n        \"Prompt Regression Tester\",\n        \"プロンプト変更の前後で、出力品質が落ちたケースを検出します。\",\n        chips=[\"Python\", \"pandas\", \"Similarity\", \"stlite\"],\n    )\n\n    with st.sidebar:\n        sidebar_header(st, \"Prompt Regression Tester\")\n        source = st.radio(\n            \"データソース\",\n            [\"サンプル (CSV)\", \"サンプル (JSON)\", \"ファイルをアップロード\"],\n            index=0,\n        )\n        uploaded = (\n            st.file_uploader(\n                \"CSV または JSON を選択\",\n                type=[\"csv\", \"json\"],\n                accept_multiple_files=False,\n            )\n            if source == \"ファイルをアップロード\"\n            else None\n        )\n        threshold = st.slider(\n            \"類似度 fail 閾値\",\n            min_value=0.0,\n            max_value=1.0,\n            value=float(DEFAULT_SIMILARITY_THRESHOLD),\n            step=0.05,\n            help=\"新出力と期待出力の類似度がこれ未満だと fail にします\",\n        )\n        if st.button(\"データを再読み込み\", use_container_width=True):\n            st.session_state[\"reload_nonce\"] = st.session_state.get(\"reload_nonce\", 0) + 1\n        st.session_state.setdefault(\"reload_nonce\", 0)\n\n    cases = _load_cases_from_input(uploaded, source)\n\n    if not cases:\n        st.info(\n            \"テストケースがありません。サンプルを選択するか、CSV/JSON をアップロードしてください。\"\n            \" 列: case_id, task, prompt_old, prompt_new, expected_output, old_output, \"\n            \"new_output, keywords(任意), forbidden(任意)\"\n        )\n        st.stop()\n\n    records = _cases_to_records(cases)\n    df = pd.DataFrame(records)\n    scores = score_cases(cases, similarity_threshold=threshold)\n    score_df = pd.DataFrame(\n        [\n            {\n                \"case_id\": s.case_id,\n                \"exact_match\": s.exact_match,\n                \"similarity\": s.similarity,\n                \"keyword_hit_rate\": s.keyword_hit_rate,\n                \"forbidden_hits\": \", \".join(s.forbidden_hits),\n                \"is_fail\": s.is_fail,\n                \"reasons\": \" / \".join(s.reasons) if s.reasons else \"—\",\n            }\n            for s in scores\n        ]\n    )\n\n    fail_n = int(score_df[\"is_fail\"].sum())\n    col_a, col_b, col_c = st.columns(3)\n    col_a.metric(\"テストケース数\", len(cases))\n    col_b.metric(\"fail\", fail_n)\n    col_c.metric(\"pass\", len(cases) - fail_n)\n\n    section(st, \"SCORES\", \"スコア比較（fail を上位表示）\")\n    show_table(\n        st,\n        score_df.rename(\n            columns={\n                \"is_fail\": \"fail\",\n                \"similarity\": \"類似度\",\n                \"keyword_hit_rate\": \"キーワード一致率\",\n            }\n        ),\n        float_fmt=\"{:.3f}\",\n    )\n\n    section(st, \"CASES\", \"テストケース一覧\")\n    show_table(st, df)\n\n    section(st, \"DETAIL\", \"ケース詳細\")\n    options = [c.case_id for c in cases]\n    selected_id = st.selectbox(\"ケースを選択\", options, index=0)\n    selected = next((c for c in cases if c.case_id == selected_id), None)\n    if selected is None:\n        st.warning(\"選択したケースが見つかりません\")\n        st.stop()\n    sel_score = next((s for s in scores if s.case_id == selected_id), None)\n\n    left, right = st.columns(2)\n    with left:\n        st.markdown(\"**旧プロンプト**\")\n        st.text_area(\n            \"old_prompt\",\n            value=selected.prompt_old,\n            height=120,\n            label_visibility=\"collapsed\",\n        )\n    with right:\n        st.markdown(\"**新プロンプト**\")\n        st.text_area(\n            \"new_prompt\",\n            value=selected.prompt_new,\n            height=120,\n            label_visibility=\"collapsed\",\n        )\n\n    st.markdown(\"**期待出力**\")\n    st.text_area(\n        \"expected\",\n        value=selected.expected_output,\n        height=100,\n        label_visibility=\"collapsed\",\n    )\n\n    if sel_score is not None:\n        if sel_score.is_fail:\n            st.error(\n                \"FAIL — \" + (\" / \".join(sel_score.reasons) if sel_score.reasons else \"条件未達\")\n            )\n        else:\n            st.success(\"PASS\")\n\n    st.markdown(\"**差分（旧 vs 新 出力）**\")\n    _render_diff(selected)\n\n    footer_backlink(st, repo=\"prompt-regression-tester\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/__init__.py": "\"\"\"prompt-regression-tester の計算ロジックパッケージ。\"\"\"\n\nfrom .comparator import changed_line_indices, side_by_side, unified_diff_lines\nfrom .loader import LoaderError, load_cases, load_cases_from_records\nfrom .models import CaseScore, TestCase\nfrom .scorer import (\n    DEFAULT_SIMILARITY_THRESHOLD,\n    exact_match,\n    forbidden_matches,\n    keyword_matches,\n    normalize,\n    score_case,\n    score_cases,\n    similarity,\n)\n\n__all__ = [\n    \"CaseScore\",\n    \"DEFAULT_SIMILARITY_THRESHOLD\",\n    \"LoaderError\",\n    \"TestCase\",\n    \"changed_line_indices\",\n    \"exact_match\",\n    \"forbidden_matches\",\n    \"keyword_matches\",\n    \"load_cases\",\n    \"load_cases_from_records\",\n    \"normalize\",\n    \"score_case\",\n    \"score_cases\",\n    \"side_by_side\",\n    \"similarity\",\n    \"unified_diff_lines\",\n]\n", "src/brand.py": "\"\"\"Portfolio Design System v2 \"Ink & Signal\" — Streamlit 共通ブランドテーマ。\n\nportfolio-hub と12デモで視覚言語を揃える単一ファイル。外部依存なし。\n正典: portfolio-plan/brand/brand.py（各リポの src/brand.py へそのままコピーする）\n仕様: portfolio-plan/design-system.md\n\n各アプリの ``streamlit_app.py`` から::\n\n    from src.brand import apply_brand, hero, section, sidebar_header, footer_backlink\n    apply_brand(st)                      # set_page_config の後に一度だけ\n    hero(st, \"KICKER\", \"タイトル\", \"サブ説明\", chips=[\"python\", \"altair\"])\n    ...\n    footer_backlink(st, repo=\"rag-eval-dashboard\")\n\nAltair を使うアプリは import 直後に::\n\n    import altair as alt\n    from src.brand import themed_altair\n    themed_altair(alt)\n\nPlotly を使うアプリは figure ごとに::\n\n    fig.update_layout(**plotly_template())\n\"\"\"\n\nfrom __future__ import annotations\n\nPALETTE = [\"#0f766e\", \"#2563eb\", \"#d97706\", \"#be185d\", \"#7c3aed\", \"#64748b\"]\n\n_FONT_BODY = \"'Inter', 'Noto Sans JP', system-ui, sans-serif\"\n_FONT_DISPLAY = \"'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif\"\n_FONT_MONO = \"'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace\"\n\n_BRAND_CSS = \"\"\"\n<style>\n@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');\n/* stlite は Material Symbols を同梱しないため明示ロード（expander 矢印等の豆腐化防止） */\n@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block');\n\n:root {\n  --bg:#f6f7f9; --fg:#0d1526; --muted:#5b6474;\n  --surface:#ffffff;\n  --line:rgba(13,21,38,0.10); --line-strong:rgba(13,21,38,0.20);\n  --accent:#0f766e; --accent-strong:#115e59; --link:#2563eb; --dark:#0b1220;\n  --shadow:0 1px 2px rgba(13,21,38,.05), 0 8px 24px rgba(13,21,38,.06);\n  --shadow-hover:0 2px 4px rgba(13,21,38,.06), 0 16px 40px rgba(13,21,38,.10);\n}\n\n/* typography（アイコンフォントは触らない） */\nhtml, body, .stApp, .stMarkdown, p, li,\nspan:not([data-testid=\"stIconMaterial\"]):not([class*=\"material-symbols\"]),\nlabel, button, input, textarea, select,\n[data-testid=\"stWidgetLabel\"], [data-testid=\"stMetricLabel\"] {\n  font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;\n}\n/* Material Symbols のリガチャを死守（expander 矢印等） */\n[data-testid=\"stIconMaterial\"], [class*=\"material-symbols\"] {\n  font-family: 'Material Symbols Rounded' !important;\n}\nh1, h2, h3, h4 {\n  font-family: 'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif;\n}\ncode, pre, kbd,\n[data-testid=\"stMetricValue\"], [data-testid=\"stMetricDelta\"] {\n  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;\n  font-variant-numeric: tabular-nums;\n}\n\n/* 背景：ほぼ無地＋上部にごく薄い teal の気配 */\n.stApp {\n  background:\n    radial-gradient(1200px 480px at 50% -160px, rgba(15,118,110,0.07), transparent 70%),\n    #f6f7f9;\n  color: var(--fg);\n}\n\n/* Streamlit クロームを控えめに */\nheader[data-testid=\"stHeader\"] { background: transparent; }\n[data-testid=\"stToolbar\"], #MainMenu, footer { visibility: hidden; height: 0; }\n[data-testid=\"stDecoration\"] { display: none; }\n\n/* 本文幅と余白 */\n.block-container, [data-testid=\"stMainBlockContainer\"] {\n  max-width: 1180px; padding-top: 2.4rem; padding-bottom: 3rem;\n}\n\n/* 見出し */\nh1 { font-weight: 700 !important; letter-spacing: -0.03em; line-height: 1.08; color: var(--fg); }\nh2 { font-weight: 700 !important; letter-spacing: -0.02em; color: var(--fg); }\nh3 { font-weight: 700 !important; letter-spacing: -0.01em; color: var(--fg); }\n\n/* Hero ブロック */\n.brand-hero { margin: 4px 0 34px; }\n.brand-kicker {\n  color: var(--accent); font-size: .75rem; font-weight: 700;\n  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px;\n}\n.brand-title {\n  font-family: 'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif;\n  font-size: clamp(2.1rem, 4.5vw, 3.2rem); font-weight: 700;\n  line-height: 1.08; letter-spacing: -0.03em; color: var(--fg); margin: 0;\n}\n.brand-sub {\n  color: var(--muted); font-size: 1rem; line-height: 1.8;\n  margin-top: 14px; max-width: 760px;\n}\n.brand-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }\n.brand-chip {\n  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);\n  padding: 4px 12px; color: var(--muted); font-size: .78rem; font-weight: 600;\n  font-family: 'IBM Plex Mono', ui-monospace, monospace;\n}\n\n/* セクション見出し */\n.brand-section { margin: 34px 0 6px; }\n.brand-section .brand-kicker { margin-bottom: 6px; }\n.brand-section-title {\n  font-family: 'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif;\n  font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em;\n  color: var(--fg); margin: 0;\n}\n\n/* サイドバー：不透明サーフェス */\n[data-testid=\"stSidebar\"] {\n  background: #fbfcfd;\n  border-right: 1px solid var(--line);\n}\n.brand-side-title {\n  font-family: 'Space Grotesk', 'Inter', 'Noto Sans JP', sans-serif;\n  font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em;\n  color: var(--fg); margin: 2px 0 2px;\n}\n\n/* metric をカード化（左に accent の芯） */\n[data-testid=\"stMetric\"] {\n  background: var(--surface);\n  border: 1px solid var(--line); border-left: 3px solid var(--accent);\n  border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);\n}\n[data-testid=\"stMetricValue\"] { color: var(--fg); font-weight: 600; }\n[data-testid=\"stMetricLabel\"] {\n  color: var(--muted); font-size: .74rem; font-weight: 600;\n  letter-spacing: .08em; text-transform: uppercase;\n}\n\n/* ボタン */\n.stButton > button, .stDownloadButton > button, .stFormSubmitButton > button {\n  border-radius: 10px; border: 1px solid var(--fg); background: var(--fg);\n  color: #fff; font-weight: 600; padding: 8px 18px;\n  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;\n}\n.stButton > button:hover, .stDownloadButton > button:hover,\n.stFormSubmitButton > button:hover {\n  background: var(--dark); border-color: var(--dark); color: #fff;\n  transform: translateY(-1px); box-shadow: var(--shadow);\n}\n\n/* タブ */\n.stTabs [data-baseweb=\"tab-list\"] { gap: 4px; border-bottom: 1px solid var(--line); }\n.stTabs [data-baseweb=\"tab\"] { font-weight: 600; color: var(--muted); }\n.stTabs [aria-selected=\"true\"] { color: var(--accent-strong); }\n\n/* 表・expander をカード化 */\n[data-testid=\"stDataFrame\"], [data-testid=\"stTable\"] {\n  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\n  box-shadow: var(--shadow); background: var(--surface);\n}\n[data-testid=\"stExpander\"] {\n  border: 1px solid var(--line); border-radius: 12px;\n  background: var(--surface); box-shadow: var(--shadow);\n}\n\n/* 入力の角丸 */\n[data-baseweb=\"select\"] > div, .stTextInput input, .stTextArea textarea,\n.stNumberInput input { border-radius: 10px !important; }\n\n/* 通知・区切り・リンク */\n[data-testid=\"stNotification\"], .stAlert { border-radius: 10px; }\nhr { border-color: var(--line); }\na { color: var(--link); }\n\n/* 静的テーブル（st.dataframe の stlite 代替） */\n.brand-table-wrap {\n  overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;\n  background: var(--surface); box-shadow: var(--shadow);\n}\n.brand-table { width: 100%; border-collapse: collapse; font-size: .88rem; }\n.brand-table th {\n  text-align: left; color: var(--muted); font-size: .72rem; font-weight: 600;\n  letter-spacing: .06em; text-transform: uppercase;\n  padding: 10px 14px; border-bottom: 1px solid var(--line-strong); background: #fbfcfd;\n}\n.brand-table td {\n  padding: 9px 14px; border-bottom: 1px solid var(--line);\n  color: var(--fg); font-variant-numeric: tabular-nums;\n}\n.brand-table tr:last-child td { border-bottom: none; }\n\n/* フッター */\n.brand-footer {\n  margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line);\n  display: flex; flex-wrap: wrap; gap: 8px 20px;\n  align-items: center; justify-content: space-between;\n  color: var(--muted); font-size: .82rem; line-height: 1.7;\n}\n.brand-footer a { color: var(--accent-strong); font-weight: 600; text-decoration: none; }\n.brand-footer a:hover { text-decoration: underline; }\n</style>\n\"\"\"\n\nHUB_URL = \"https://oishizawads.github.io/portfolio-hub/\"\nGITHUB_OWNER = \"oishizawads\"\n\n\ndef apply_brand(st) -> None:\n    \"\"\"ブランド CSS を注入する。``st.set_page_config`` の後に一度だけ呼ぶ。\"\"\"\n    st.markdown(_BRAND_CSS, unsafe_allow_html=True)\n\n\ndef _esc(text: str) -> str:\n    return (\n        str(text)\n        .replace(\"&\", \"&amp;\")\n        .replace(\"<\", \"&lt;\")\n        .replace(\">\", \"&gt;\")\n    )\n\n\ndef hero(\n    st,\n    kicker: str,\n    title: str,\n    subtitle: str | None = None,\n    chips: list[str] | None = None,\n) -> None:\n    \"\"\"ヒーロー見出し（キッカー + 大見出し + サブ説明 + 技術チップ）。\"\"\"\n    html = (\n        '<div class=\"brand-hero\">'\n        f'<div class=\"brand-kicker\">{_esc(kicker)}</div>'\n        f'<div class=\"brand-title\">{_esc(title)}</div>'\n    )\n    if subtitle:\n        html += f'<div class=\"brand-sub\">{_esc(subtitle)}</div>'\n    if chips:\n        html += '<div class=\"brand-chips\">'\n        html += \"\".join(f'<span class=\"brand-chip\">{_esc(c)}</span>' for c in chips)\n        html += \"</div>\"\n    html += \"</div>\"\n    st.markdown(html, unsafe_allow_html=True)\n\n\ndef section(st, kicker: str, title: str) -> None:\n    \"\"\"本文セクション見出し（kicker + タイトル）。``st.header`` の代替。\"\"\"\n    st.markdown(\n        '<div class=\"brand-section\">'\n        f'<div class=\"brand-kicker\">{_esc(kicker)}</div>'\n        f'<div class=\"brand-section-title\">{_esc(title)}</div>'\n        \"</div>\",\n        unsafe_allow_html=True,\n    )\n\n\ndef sidebar_header(st, title: str, caption: str | None = None) -> None:\n    \"\"\"サイドバー先頭の見出し。\"\"\"\n    html = (\n        '<div class=\"brand-kicker\" style=\"margin-top:4px\">Controls</div>'\n        f'<div class=\"brand-side-title\">{_esc(title)}</div>'\n    )\n    st.sidebar.markdown(html, unsafe_allow_html=True)\n    if caption:\n        st.sidebar.caption(caption)\n\n\ndef footer_backlink(st, repo: str | None = None) -> None:\n    \"\"\"合成データ注記と Portfolio Hub への戻りリンクを持つ共通フッター。\"\"\"\n    links = f'<a href=\"{HUB_URL}\">← Portfolio Hub</a>'\n    if repo:\n        links += (\n            f' &nbsp; <a href=\"https://github.com/{GITHUB_OWNER}/{_esc(repo)}\">'\n            \"GitHub ↗</a>\"\n        )\n    st.markdown(\n        '<div class=\"brand-footer\">'\n        \"<span>Synthetic data demo — 数値はすべて合成データで、実在の精度・効果を示しません。</span>\"\n        f\"<span>{links}</span>\"\n        \"</div>\",\n        unsafe_allow_html=True,\n    )\n\n\ndef show_table(st, df, hide_index: bool = True, float_fmt: str | None = None) -> None:\n    \"\"\"静的 HTML テーブルとして描画する。\n\n    stlite 1.8 系では st.dataframe（glide-data-grid）が空描画になるため、\n    デモの一覧表示はこのヘルパーで代替する。\n    \"\"\"\n    data = df.copy()\n    if float_fmt:\n        for col in data.columns:\n            if getattr(data[col].dtype, \"kind\", \"\") == \"f\":\n                data[col] = data[col].map(lambda v: float_fmt.format(v))\n    html = data.to_html(index=not hide_index, classes=\"brand-table\", border=0)\n    st.markdown(f'<div class=\"brand-table-wrap\">{html}</div>', unsafe_allow_html=True)\n\n\ndef altair_config() -> dict:\n    \"\"\"ブランド仕様の Altair テーマ設定を返す。\"\"\"\n    return {\n        \"config\": {\n            \"background\": \"transparent\",\n            \"font\": _FONT_BODY,\n            \"range\": {\"category\": PALETTE},\n            \"axis\": {\n                \"labelFont\": _FONT_BODY,\n                \"titleFont\": _FONT_BODY,\n                \"labelColor\": \"#5b6474\",\n                \"titleColor\": \"#0d1526\",\n                \"titleFontWeight\": 600,\n                \"labelFontSize\": 12,\n                \"titleFontSize\": 12,\n                \"gridColor\": \"rgba(13,21,38,0.08)\",\n                \"domainColor\": \"rgba(13,21,38,0.20)\",\n                \"tickColor\": \"rgba(13,21,38,0.20)\",\n            },\n            \"legend\": {\n                \"labelFont\": _FONT_BODY,\n                \"titleFont\": _FONT_BODY,\n                \"labelColor\": \"#5b6474\",\n                \"titleColor\": \"#0d1526\",\n            },\n            \"title\": {\n                \"font\": _FONT_DISPLAY,\n                \"color\": \"#0d1526\",\n                \"fontSize\": 15,\n                \"fontWeight\": 700,\n                \"anchor\": \"start\",\n            },\n            \"view\": {\"stroke\": \"transparent\"},\n            \"bar\": {\"color\": PALETTE[0]},\n            \"line\": {\"color\": PALETTE[0], \"strokeWidth\": 2.5},\n            \"point\": {\"color\": PALETTE[0], \"filled\": True, \"size\": 70},\n            \"area\": {\"color\": PALETTE[0], \"opacity\": 0.16, \"line\": True},\n            \"rule\": {\"color\": \"#5b6474\"},\n        }\n    }\n\n\ndef themed_altair(alt) -> None:\n    \"\"\"Altair にブランドテーマを登録して有効化する（バージョン差異を吸収）。\"\"\"\n    theme = altair_config\n\n    try:  # altair >= 5.5\n        alt.theme.register(\"brand\", enable=True)(theme)\n        return\n    except Exception:\n        pass\n    try:  # altair < 5.5\n        alt.themes.register(\"brand\", theme)\n        alt.themes.enable(\"brand\")\n    except Exception:\n        pass\n\n\ndef set_plotly_theme() -> None:\n    \"\"\"plotly express が色を焼き込む前にブランドテンプレートを既定化する。\n\n    figure 生成より前（import 直後）に一度だけ呼ぶ。\n    \"\"\"\n    import plotly.graph_objects as go\n    import plotly.io as pio\n\n    pio.templates[\"brand\"] = go.layout.Template(layout=plotly_template())\n    pio.templates.default = \"plotly_white+brand\"\n\n\ndef plotly_template() -> dict:\n    \"\"\"``fig.update_layout(**plotly_template())`` で適用する共通レイアウト。\"\"\"\n    grid = \"rgba(13,21,38,0.08)\"\n    zero = \"rgba(13,21,38,0.20)\"\n    return {\n        \"font\": {\"family\": \"Inter, Noto Sans JP, sans-serif\", \"color\": \"#0d1526\", \"size\": 13},\n        \"paper_bgcolor\": \"rgba(0,0,0,0)\",\n        \"plot_bgcolor\": \"rgba(0,0,0,0)\",\n        \"colorway\": PALETTE,\n        \"xaxis\": {\"gridcolor\": grid, \"zerolinecolor\": zero, \"linecolor\": zero},\n        \"yaxis\": {\"gridcolor\": grid, \"zerolinecolor\": zero, \"linecolor\": zero},\n        \"legend\": {\"bgcolor\": \"rgba(0,0,0,0)\"},\n        \"margin\": {\"t\": 48, \"r\": 16, \"b\": 48, \"l\": 56},\n        \"hoverlabel\": {\"font\": {\"family\": \"Inter, Noto Sans JP, sans-serif\"}},\n    }\n", "src/comparator.py": "\"\"\"旧出力と新出力の差分表示用ヘルパ。\"\"\"\n\nfrom __future__ import annotations\n\nimport difflib\n\nfrom .models import TestCase\n\n\ndef unified_diff_lines(case: TestCase) -> list[str]:\n    \"\"\"旧出力と新出力の unified diff を行リストで返す。\"\"\"\n    old_lines = case.old_output.splitlines() or [case.old_output]\n    new_lines = case.new_output.splitlines() or [case.new_output]\n    return list(\n        difflib.unified_diff(\n            old_lines,\n            new_lines,\n            fromfile=f\"{case.case_id}.old\",\n            tofile=f\"{case.case_id}.new\",\n            lineterm=\"\",\n        )\n    )\n\n\ndef side_by_side(case: TestCase) -> tuple[list[str], list[str]]:\n    \"\"\"旧・新を並べて比較しやすいよう行リストを返す（長さは揃える）。\"\"\"\n    old_lines = case.old_output.splitlines() or [case.old_output]\n    new_lines = case.new_output.splitlines() or [case.new_output]\n    n = max(len(old_lines), len(new_lines))\n    old_padded = old_lines + [\"\"] * (n - len(old_lines))\n    new_padded = new_lines + [\"\"] * (n - len(new_lines))\n    return old_padded, new_padded\n\n\ndef changed_line_indices(case: TestCase) -> list[int]:\n    \"\"\"旧・新で内容が異なる行番号（0始まり）を返す。\"\"\"\n    old_lines, new_lines = side_by_side(case)\n    return [i for i, (o, n) in enumerate(zip(old_lines, new_lines)) if o != n]\n", "src/loader.py": "\"\"\"テストケースの読み込み（CSV / JSON / 辞書リスト）。\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport json\nfrom pathlib import Path\nfrom typing import Any\n\nfrom .models import TestCase\n\n\nclass LoaderError(ValueError):\n    \"\"\"読み込み時の軽微な問題を表す例外（空ファイル・未対応形式など）。\"\"\"\n\n\ndef _load_rows_from_csv(path: Path) -> list[dict]:\n    \"\"\"CSV ファイルを dict 行リストへ読み込む。\"\"\"\n    with path.open(\"r\", encoding=\"utf-8\", newline=\"\") as f:\n        reader = csv.DictReader(f)\n        rows = list(reader)\n    return rows\n\n\ndef _load_rows_from_json(path: Path) -> list[dict]:\n    \"\"\"JSON ファイルを dict 行リストへ読み込む（配列または {\"cases\":[...]} を許容）。\"\"\"\n    with path.open(\"r\", encoding=\"utf-8\") as f:\n        data: Any = json.load(f)\n    if isinstance(data, dict) and \"cases\" in data:\n        data = data[\"cases\"]\n    if not isinstance(data, list):\n        raise LoaderError(\"JSON のトップレベルは配列か {'cases': [...]} が必要です\")\n    return [row if isinstance(row, dict) else {\"raw\": row} for row in data]\n\n\ndef load_cases(path: Path) -> list[TestCase]:\n    \"\"\"ファイルパスから TestCase リストを生成する。\n\n    Args:\n        path: CSV または JSON ファイルへのパス。\n\n    Returns:\n        TestCase リスト。空ファイル・欠損列でも空リストを返し例外は投げない。\n\n    Raises:\n        LoaderError: 拡張子未対応・JSON 構造不正のとき。\n    \"\"\"\n    if not path.exists() or path.stat().st_size == 0:\n        return []\n    suffix = path.suffix.lower()\n    if suffix == \".csv\":\n        rows = _load_rows_from_csv(path)\n    elif suffix == \".json\":\n        rows = _load_rows_from_json(path)\n    else:\n        raise LoaderError(f\"未対応の拡張子です: {suffix}（.csv または .json を指定）\")\n    return [TestCase.from_row(row, idx) for idx, row in enumerate(rows)]\n\n\ndef load_cases_from_records(records: list[dict]) -> list[TestCase]:\n    \"\"\"メモリ上の辞書リストから TestCase リストを生成する（UI 入力用）。\"\"\"\n    return [TestCase.from_row(row, idx) for idx, row in enumerate(records)]\n", "src/models.py": "\"\"\"テストケースとスコアのデータモデル。\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Sequence\n\n\n@dataclass\nclass TestCase:\n    \"\"\"1件のプロンプト回帰テストケース。\"\"\"\n\n    __test__ = False  # pytest がテストクラスと誤認するのを防ぐ\n\n    case_id: str\n    task: str\n    prompt_old: str\n    prompt_new: str\n    expected_output: str\n    old_output: str\n    new_output: str\n    keywords: list[str] = field(default_factory=list)\n    forbidden: list[str] = field(default_factory=list)\n\n    @classmethod\n    def from_row(cls, row: dict, index: int) -> \"TestCase\":\n        \"\"\"辞書1行から TestCase を生成する。欠損列は安全な既定値で補う。\n\n        Args:\n            row: 読み込み元の1行分の辞書。\n            index: 行番号ベースのフォールバックID。\n\n        Returns:\n            TestCase インスタンス。\n        \"\"\"\n        def _split(value: object) -> list[str]:\n            \"\"\"カンマ区切りまたはリスト値をキーワード/禁止語リストへ分解する。\"\"\"\n            if isinstance(value, list):\n                return [str(v).strip() for v in value if str(v).strip()]\n            if not isinstance(value, str) or not value.strip():\n                return []\n            return [v.strip() for v in value.split(\",\") if v.strip()]\n\n        return cls(\n            case_id=str(row.get(\"case_id\") or row.get(\"id\") or f\"case-{index:03d}\"),\n            task=str(row.get(\"task\") or \"\"),\n            prompt_old=str(row.get(\"prompt_old\") or row.get(\"prompt_old_text\") or \"\"),\n            prompt_new=str(row.get(\"prompt_new\") or row.get(\"prompt_new_text\") or \"\"),\n            expected_output=str(row.get(\"expected_output\") or \"\"),\n            old_output=str(row.get(\"old_output\") or \"\"),\n            new_output=str(row.get(\"new_output\") or \"\"),\n            keywords=_split(row.get(\"keywords\")),\n            forbidden=_split(row.get(\"forbidden\")),\n        )\n\n\n@dataclass\nclass CaseScore:\n    \"\"\"1ケース分の採点結果。\"\"\"\n\n    case_id: str\n    exact_match: bool\n    similarity: float\n    keyword_hit_rate: float\n    keyword_misses: list[str]\n    forbidden_hits: list[str]\n    is_fail: bool\n    reasons: list[str]\n\n\ndef collect_failure_reasons(\n    forbidden_hits: Sequence[str],\n    keyword_misses: Sequence[str],\n    similarity: float,\n    threshold: float,\n) -> list[str]:\n    \"\"\"fail 判定理由を人間可読で列挙する。\"\"\"\n    reasons: list[str] = []\n    if forbidden_hits:\n        reasons.append(f\"禁止語が含まれる: {', '.join(forbidden_hits)}\")\n    if keyword_misses:\n        reasons.append(f\"期待キーワード不足: {', '.join(keyword_misses)}\")\n    if similarity < threshold:\n        reasons.append(f\"類似度が閾値未満: {similarity:.2f} < {threshold:.2f}\")\n    return reasons\n", "src/scorer.py": "\"\"\"採点ロジック（文字列一致・キーワード一致・禁止語検出）。\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom difflib import SequenceMatcher\n\nfrom .models import CaseScore, TestCase, collect_failure_reasons\n\nDEFAULT_SIMILARITY_THRESHOLD = 0.6\n\n\ndef normalize(text: str) -> str:\n    \"\"\"比較前に文字列を正規化する（小文字化・連続空白の圧縮・前後空白除去）。\"\"\"\n    if not text:\n        return \"\"\n    lowered = text.lower()\n    collapsed = re.sub(r\"\\s+\", \" \", lowered)\n    return collapsed.strip()\n\n\ndef similarity(a: str, b: str) -> float:\n    \"\"\"正規化後の2文字列の類似度を 0.0–1.0 で返す。\"\"\"\n    na, nb = normalize(a), normalize(b)\n    if not na and not nb:\n        return 1.0\n    if not na or not nb:\n        return 0.0\n    return SequenceMatcher(None, na, nb).ratio()\n\n\ndef exact_match(a: str, b: str) -> bool:\n    \"\"\"正規化後の完全一致。\"\"\"\n    return normalize(a) == normalize(b)\n\n\ndef keyword_matches(text: str, keywords: list[str]) -> list[str]:\n    \"\"\"キーワードのうち text に含まれるものを返す（正規化比較）。\"\"\"\n    norm_text = normalize(text)\n    return [kw for kw in keywords if kw and normalize(kw) in norm_text]\n\n\ndef forbidden_matches(text: str, forbidden: list[str]) -> list[str]:\n    \"\"\"禁止語のうち text に含まれるものを返す（正規化比較）。\"\"\"\n    norm_text = normalize(text)\n    return [w for w in forbidden if w and normalize(w) in norm_text]\n\n\ndef score_case(\n    case: TestCase,\n    similarity_threshold: float = DEFAULT_SIMILARITY_THRESHOLD,\n) -> CaseScore:\n    \"\"\"1ケースを旧・新それぞれで採点し、新出力ベースで fail 判定する。\n\n    Args:\n        case: 採点対象の TestCase。\n        similarity_threshold: これ未満の類似度は fail 要因とする。\n\n    Returns:\n        CaseScore インスタンス。理由は人間可読で reasons に格納。\n    \"\"\"\n    sim_new = similarity(case.expected_output, case.new_output)\n    exact = exact_match(case.expected_output, case.new_output)\n    kws = case.keywords\n    hit_kws = keyword_matches(case.new_output, kws)\n    miss_kws = [kw for kw in kws if kw not in hit_kws]\n    hit_rate = (len(hit_kws) / len(kws)) if kws else 1.0\n    forbids = forbidden_matches(case.new_output, case.forbidden)\n\n    is_fail = bool(forbids) or hit_rate < 1.0 or sim_new < similarity_threshold\n    reasons = collect_failure_reasons(forbids, miss_kws, sim_new, similarity_threshold)\n\n    return CaseScore(\n        case_id=case.case_id,\n        exact_match=exact,\n        similarity=round(sim_new, 3),\n        keyword_hit_rate=round(hit_rate, 3),\n        keyword_misses=miss_kws,\n        forbidden_hits=forbids,\n        is_fail=is_fail,\n        reasons=reasons,\n    )\n\n\ndef score_cases(\n    cases: list[TestCase],\n    similarity_threshold: float = DEFAULT_SIMILARITY_THRESHOLD,\n) -> list[CaseScore]:\n    \"\"\"複数ケースを一括採点し、fail を先頭に安定ソートして返す。\"\"\"\n    scores = [score_case(c, similarity_threshold) for c in cases]\n    scores.sort(key=lambda s: (s.is_fail, s.case_id), reverse=True)\n    return scores\n", ".streamlit/config.toml": "# Portfolio Design System v2 — 共通 Streamlit テーマ（正典: portfolio-plan/brand/config.toml）\n[theme]\nbase = \"light\"\nprimaryColor = \"#0f766e\"\nbackgroundColor = \"#f6f7f9\"\nsecondaryBackgroundColor = \"#ffffff\"\ntextColor = \"#0d1526\"\nfont = \"sans serif\"\n", "sample_data/sample_cases.csv": "case_id,task,prompt_old,prompt_new,expected_output,old_output,new_output,keywords,forbidden\nmail-summary,\"顧客メールの要約を3行で出力せよ\",\"次のメールを3行で要約せよ。感情は書くな。\",\"次のメールを要点3つでまとめよ。簡潔に。\",\"請求書の金額誤りを指摘。再発行を依頼。期限は今週末。\",\"請求書の金額誤りを指摘。再発行を依頼。期限は今週末。\",\"顧客は請求書の金額が違うと困っている。再発行してほしい。今週中に欲しい。\",\"請求書,再発行,期限,金額\",\"推測,恐らく\"\ncategory-classify,\"問い合わせをカテゴリ分類せよ\",\"問い合わせを次のいずれかに分類せよ: 請求/技術/返品/その他\",\"問い合わせを分類し、理由も添えよ。\",\"請求\",\"請求\",\"請求（顧客が金額について問い合わせたため。推測だが返品の可能性もある）\",\"請求\",\"推測,可能性,思う\"\nreply-draft,\"礼状を1段落で作成せよ\",\"礼状を丁寧な1段落で作成せよ。\",\"礼状を1段落で作成せよ。宛名を入れること。\",\"拝啓 お世話になっております。この度はご協力いただき誠にありがとうございます。今後ともよろしくお願いいたします。\",\"拝啓 ご協力ありがとうございます。よろしくお願いします。\",\"拝啓 お世話になっております。この度はご協力いただき誠にありがとうございます。今後ともよろしくお願いいたします。\",\"拝啓,ありがとうございます,よろしく\",\"敬具なし\"\nfaq-answer,\"FAQ回答を100字以内で出力せよ\",\"返品期限は何日ですか。100字以内で答えよ。\",\"返品期限について簡潔に答えよ。\",\"返品期限は商品到着後14日です。未開封が条件です。詳細は返品ポリシーをご覧ください。\",\"返品期限は商品到着後14日です。未開封が条件です。\",\"返品は可能です。お客様の都合に合わせて柔軟に対応いたしますのでご安心ください。\",\"14日,未開封,返品ポリシー\",\"無期限,何日でも\"\n", "sample_data/sample_cases.json": "{\n  \"cases\": [\n    {\n      \"case_id\": \"mail-summary\",\n      \"task\": \"顧客メールの要約を3行で出力せよ\",\n      \"prompt_old\": \"次のメールを3行で要約せよ。感情は書くな。\",
