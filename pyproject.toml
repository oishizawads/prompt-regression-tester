[project]
name = "prompt-regression-tester"
version = "0.1.0"
description = "プロンプト変更前後の出力品質 regression を検出する小型 Streamlit アプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
